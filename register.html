<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - KrishiDrishti</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <div class="card" style="width: 100%; max-width: 600px; padding: 36px; box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html">
        <img src="assets/logo.png" alt="KrishiDrishti Logo" style="width: 52px; height: 52px; border-radius: 10px; margin-bottom: 8px;">
      </a>
      <h2 style="font-size: 1.5rem; color: var(--primary);">Join KrishiDrishti</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Create your smart farmer profile</p>
    </div>

    <form id="registerForm">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="name">Full Name *</label>
          <input type="text" id="name" class="form-control" placeholder="Ramesh Patel" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="patel@farmer.in" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="phone">Mobile Number *</label>
          <input type="tel" id="phone" class="form-control" placeholder="9876543210" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="language">Preferred Language</label>
          <select id="language" class="form-select lang-selector">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
            <option value="ur">اردو (Urdu)</option>
            <option value="mai">मैथिली (Maithili)</option>
            <option value="awa">अवधी (Awadhi)</option>
            <option value="bun">बुंदेली (Bundeli)</option>
            <option value="hr">हरियाणवी (Haryanvi)</option>
            <option value="ta">தமிழ் (Tamil)</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="gu">ગુજરાતી (Gujarati)</option>
            <option value="mr">मराठी (Marathi)</option>
            <option value="or">ଓଡ଼ିଆ (Odia)</option>
          </select>
        </div>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label class="form-label" for="state">State</label>
          <input type="text" id="state" class="form-control" placeholder="Punjab">
        </div>
        <div class="form-group">
          <label class="form-label" for="district">District</label>
          <input type="text" id="district" class="form-control" placeholder="Ludhiana">
        </div>
        <div class="form-group">
          <label class="form-label" for="village">Village</label>
          <input type="text" id="village" class="form-control" placeholder="Samrala">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password *</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>

      <div id="registerError" style="display: none; background: var(--danger-light); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px;"></div>

      <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
        <i class="fas fa-user-check"></i> Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
      Already registered? <a href="login.html" style="font-weight: 600;">Login Here</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="voice.js"></script>
  <script src="location.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('registerForm');
      const registerBtn = document.getElementById('registerBtn');
      const registerError = document.getElementById('registerError');

      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        registerError.style.display = 'none';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const language = document.getElementById('language').value;
        const state = document.getElementById('state').value.trim();
        const district = document.getElementById('district').value.trim();
        const village = document.getElementById('village').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          registerError.textContent = 'Passwords do not match.';
          registerError.style.display = 'block';
          return;
        }

        registerBtn.disabled = true;
        registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

        try {
          const res = await fetch(`${window.KRISHI_CONFIG.API_BASE_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone, language, state, district, village, password })
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.message || 'Registration failed');
          }

          showToast('Registration successful! Please log in.', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 800);
        } catch (err) {
          registerError.textContent = err.message || 'Registration failed.';
          registerError.style.display = 'block';
          registerBtn.disabled = false;
          registerBtn.innerHTML = '<i class="fas fa-user-check"></i> Register Account';
        }
      });
    });
  </script>
</body>
</html>
